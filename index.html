<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kawarimi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: the game frame alone, centred; HUD and title settings live inside the frame; touch pad below on phones. */
:root {
  --void: #07090e;
  --frame: #1c2430;
  --ink: #efe5cf;
  --dim: #8796a3;
  --soft: #b4c0ca;
  --ember: #e8a050;
  --spirit: #9fe3e6;
  --pixel: "DotGothic16", ui-monospace, "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--void);
  color: var(--ink);
  font-family: var(--pixel);
  display: grid;
  place-items: center;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.shell { display: grid; gap: 12px; justify-items: center; width: 100%; }
.stage { position: relative; line-height: 0; --u: 3px; }
canvas {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: #000;
  box-shadow: 0 0 0 1px #000, 0 0 0 calc(var(--u) * 1.4) var(--frame), 0 24px 60px #000c;
}
.hud {
  position: absolute; inset: 0; pointer-events: none;
  font-size: calc(var(--u) * 7.5); line-height: 1; letter-spacing: .08em;
  text-shadow: 0 calc(var(--u) * .5) 0 #000, 0 0 calc(var(--u) * 3) #000;
}
.hud .tl { position: absolute; left: calc(var(--u) * 6); top: calc(var(--u) * 5); display: flex; gap: calc(var(--u) * 8); }
.hud .deaths { color: var(--dim); }
.hud .swaps {
  position: absolute; right: calc(var(--u) * 6); top: calc(var(--u) * 5);
  color: var(--spirit); transform-origin: center; will-change: transform;
}
.hud .swaps.zero { color: var(--dim); }
.hud .swaps.flash { animation: deny .18s steps(2) 3; }
@keyframes deny { 50% { color: #ff6a55; } }
.hud.off { visibility: hidden; }
.keys {
  position: absolute; left: 0; right: 0; bottom: calc(var(--u) * 5);
  display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * 3) calc(var(--u) * 9);
  font-size: max(13px, calc(var(--u) * 5.6)); line-height: 1.2; letter-spacing: .06em;
  color: var(--soft); text-shadow: 0 1px 0 #000, 0 0 8px #000; pointer-events: none;
  padding-inline: calc(var(--u) * 4);
}
.keys b { color: var(--ink); font-weight: 400; margin-right: .4em; }
.keys[hidden] { display: none; }
.settings {
  position: absolute; left: calc(var(--u) * 6); top: calc(var(--u) * 5);
  display: grid; gap: calc(var(--u) * 3); justify-items: start;
  font-size: max(12px, calc(var(--u) * 5.4)); line-height: 1.15; letter-spacing: .08em;
}
.settings[hidden] { display: none; }
.settings button {
  font: inherit; letter-spacing: inherit; color: var(--dim); background: none; border: 0; padding: 0;
  cursor: pointer; text-shadow: 0 1px 0 #000;
}
.settings button:hover, .settings button:focus-visible { color: var(--ink); outline: none; }
.binds { display: grid; gap: calc(var(--u) * 2.5); padding: calc(var(--u) * 4) calc(var(--u) * 5); background: #07090ed9; box-shadow: 0 0 0 1px #2c3746; }
.binds[hidden] { display: none; }
.binds button { display: flex; justify-content: space-between; gap: calc(var(--u) * 10); min-width: calc(var(--u) * 64); }
.binds button b { font-weight: 400; color: var(--ink); }
.binds button.listen b { color: var(--ember); }
.veil { position: absolute; inset: 0; background: #000; opacity: 0; transition: opacity .45s; pointer-events: none; }
.veil.on { opacity: .55; }
.bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.bar button {
  font-family: var(--pixel); font-size: 15px; letter-spacing: .08em; color: var(--soft);
  background: #0d1218; border: 1px solid #2c3746; padding: 7px 14px; cursor: pointer;
}
.bar button:hover { color: var(--ink); border-color: var(--dim); }
.bar button.wake { color: var(--ember); border-color: #5a4028; }
.bar button:focus-visible, .touch button:focus-visible { outline: 2px solid var(--spirit); outline-offset: 2px; }
.touch { display: none; width: 100%; max-width: 560px; grid-template-columns: 1fr 1fr 1.2fr 1.2fr 1.2fr; gap: 8px; touch-action: none; user-select: none; -webkit-user-select: none; }
.touch button { font-family: var(--pixel); font-size: 15px; color: var(--ink); background: #121820; border: 1px solid var(--frame); padding: 16px 0; touch-action: none; }
.touch button.on { background: var(--frame); }
@media (pointer: coarse) { .touch { display: grid; } }
@media (prefers-reduced-motion: reduce) { .veil { transition: none; } }
</style>
</head>
<body>
<main class="shell">
  <div class="stage" id="stage">
    <canvas id="cv" width="320" height="192" aria-label="Game screen"></canvas>
    <div class="veil" id="veil"></div>
    <div class="keys" id="keys"></div>
    <div class="settings" id="settings">
      <button type="button" id="setBtn">SETTINGS</button>
      <div class="binds" id="binds" hidden>
        <button type="button" data-bind="jump"><span>JUMP</span><b></b></button>
        <button type="button" data-bind="throw"><span>THROW</span><b></b></button>
        <button type="button" data-bind="swap"><span>SWAP</span><b></b></button>
      </div>
    </div>
    <div class="hud off" id="hud">
      <div class="tl"><span id="lvl">LEVEL 1</span><span class="deaths" id="deaths">DEATHS 0</span></div>
      <div class="swaps" id="swaps">SWAPS: 0</div>
    </div>
  </div>
  <div class="bar">
    <button type="button" id="restartBtn">RESTART · R</button>
    <button type="button" id="muteBtn" aria-pressed="false">SOUND ON · M</button>
  </div>
  <div class="touch" id="touch" aria-label="Touch controls">
    <button type="button" data-act="left" aria-label="Move left">◀</button>
    <button type="button" data-act="right" aria-label="Move right">▶</button>
    <button type="button" data-act="jump">JUMP</button>
    <button type="button" data-act="throw">THROW</button>
    <button type="button" data-act="swap">SWAP</button>
  </div>
</main>

  // # stone   W wood (kunai sticks)   w rotten wood (sticks, gives way if you stand on it)

  const LEVELS = [

      '#.P./....###########',
      '####################'] },
    // 19: climb the tower, then bounce the kunai down through the paper roof of the well
    { swaps: 1, map: [
      '####################',
      '#..................#',
      '#..................#',
      '#............\\.....#',
      '####W..............#',
      '####W.....#======###',

      '####W.P...#..C...###',
      '####################'] },
    // 20: the great lantern. Strike it three times up the mirror shafts, dodge its dives,
    // then ride the last shaft up to the kit it was guarding.
    { swaps: 1, map: [
      '####################',
      '#................b.#',
      '#................bC#',

      '####################'] }
  ];

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const hash = (a, b, s) => { let h = (a * 374761393 + b * 668265263 + (s || 0) * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

  // ---------- save ----------
  const SAVE_KEY = 'kawarimi-v2';
  let save = { level: 0, deaths: 0, time: 0 };
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && typeof s.level === 'number') save = Object.assign(save, s); } catch (e) {}
  const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };

  // ---------- audio ----------
  // One context, unlocked by the first click, tap or key; everything runs through a limiter
  // and is scheduled a little ahead so a slow frame never makes a sound start late and click.
  let ac = null, master = null, musicBus = null, noiseBuf = null, muted = false;
  function audioInit() {
    if (!ac) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        ac = new AC({ latencyHint: 'interactive' });
        const limiter = ac.createDynamicsCompressor();
        limiter.threshold.value = -12; limiter.knee.value = 10; limiter.ratio.value = 8;
        limiter.attack.value = 0.002; limiter.release.value = 0.15;
        master = ac.createGain(); master.gain.value = 0.7;
        master.connect(limiter); limiter.connect(ac.destination);
        musicBus = ac.createGain(); musicBus.gain.value = 0.6; musicBus.connect(master);
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        ac.onstatechange = soundLabel;
      } catch (e) { ac = null; return; }
    }
    if (ac.state !== 'running') ac.resume().then(soundLabel, () => {});
    soundLabel();
  }
  // wakeClick: whether this press on the sound button is the one that wakes the sound (read before waking it)
  let wakeClick = false;
  ['pointerdown', 'touchend', 'mousedown', 'keydown'].forEach(ev => addEventListener(ev, e => {
    if (ev === 'pointerdown' && e.target && e.target.id === 'muteBtn') wakeClick = e.target.classList.contains('wake');
    audioInit();
  }, { capture: true, passive: true }));
  const live = () => ac && !muted && ac.state === 'running';
  function tone(f, dur, type, vol, slide, delay) {
    if (!live()) return;
    const t = ac.currentTime + 0.025 + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.05, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, freq) {
    if (!live()) return;
    const t = ac.currentTime + 0.025;
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq || 1200; f.Q.value = 0.8;
    g.gain.setValueAtTime(vol || 0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t, Math.random() * 0.5, dur + 0.05);
  }
  const SFX = {
    jump: () => tone(300, 0.09, 'square', 0.025, 260),
    land: () => noise(0.05, 0.05, 500),

    thunk: () => { tone(120, 0.12, 'square', 0.06, -50); noise(0.06, 0.07, 700); },
    clink: () => { tone(1800, 0.08, 'square', 0.025); tone(2600, 0.06, 'square', 0.018, 0, 0.02); },
    ting: () => { tone(2093, 0.12, 'sine', 0.035); tone(3136, 0.08, 'sine', 0.018, 0, 0.02); },
    recall: () => tone(500, 0.1, 'triangle', 0.035, 500),
    catch: () => tone(1400, 0.04, 'triangle', 0.025),
    swap: () => { tone(220, 0.2, 'sine', 0.08, 900); noise(0.18, 0.04, 1800); },
    paper: () => noise(0.05, 0.04, 4500),
    spirit: () => { tone(1200, 0.25, 'sine', 0.045, -900); tone(600, 0.25, 'triangle', 0.025, -400, 0.03); },
    bossHit: () => { tone(180, 0.35, 'sawtooth', 0.05, -90); noise(0.25, 0.08, 900); tone(900, 0.2, 'sine', 0.04, -600, 0.03); },
    warn: () => { tone(98, 0.6, 'sawtooth', 0.035, 40); tone(147, 0.6, 'sine', 0.03, 30); },
    slam: () => { tone(70, 0.3, 'square', 0.06, -30); noise(0.3, 0.1, 300); },
    bossDie: () => { noise(0.8, 0.1, 500); [880, 659, 523, 392, 330].forEach((f, i) => tone(f, 0.5, 'triangle', 0.045, -100, i * 0.09)); },
    lampOff: () => { tone(988, 0.3, 'sine', 0.04, -500); noise(0.12, 0.03, 2500); },
    lampOn: () => { tone(659, 0.12, 'sine', 0.04); tone(988, 0.3, 'sine', 0.04, 0, 0.06); },
    crack: () => noise(0.04, 0.035, 900),
    crumble: () => { noise(0.25, 0.09, 400); tone(90, 0.2, 'square', 0.04, -40); },
    free: () => [784, 988, 1319].forEach((f, i) => tone(f, 0.16, 'triangle', 0.045, 0, i * 0.07)),

    clear: () => [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, 0.22, 'triangle', 0.04, 0, i * 0.08)),
    select: () => tone(880, 0.05, 'square', 0.02)

  const sfx = n => SFX[n] && SFX[n]();

  // ---------- music ----------

      const m = s.kind === 'B' ? 4 : 1;
      if (overlap(pb, { x: s.x + m, y: s.y + m, w: s.w - m * 2, h: s.h - m * 2 })) return die();

    if (p.y > H + 4) return die();

      mode = 'clear'; modeT = 0; irisDir = -1;

  }

  // ---------- step ----------
  let keepInput = false;
  function stepPlay() {
    if (pressed.restart && mode !== 'clear') { respawn(); return; }
    if (pressed.menu) { scene = 'title'; return; }
    if (hitstop > 0) { hitstop--; keepInput = true; return; }
    if (mode === 'play') {
      if (freeze > 0) freeze--;
      else { updateKunai(); updatePlayer(); levelTime += 1 / 60; }
      updateWisps();
      if (freeze <= 0) checkWorld();
    } else {
      modeT++;
      if (mode === 'dead' && modeT > 40) respawn();
      if (mode === 'clear') {
        for (const cg of cages) if (cg.hop != null) cg.hop++;
        if (modeT > 75) {
          if (levelIdx + 1 >= LEVELS.length) scene = 'end';
          else loadLevel(levelIdx + 1, true);
        }
      }
    }
  }
  function step() {
    keepInput = false;
    if (scene === 'title') stepTitle();
    else if (scene === 'end') { if (pressed.confirm || pressed.throw) { scene = 'title'; sfx('select'); } }
    else stepPlay();
    if (scene === 'play') {
      if (irisDir > 0) { iris = Math.min(1, iris + 0.045); if (iris >= 1) irisDir = 0; }
      else if (irisDir < 0) iris = Math.max(0, iris - 0.03);
    }
    updateParticles();
    for (const f of flies) { f.t += f.s; f.x += Math.cos(f.t) * 0.15 + f.vx; f.y += Math.sin(f.t * 1.3) * 0.12; if (f.x < 0) f.x += W; if (f.x > W) f.x -= W; }
    if (shake > 0) shake -= 0.5;
    if (flashT > 0) flashT--;
    music();
    tick++;
    // presses made during a freeze frame are kept for the next real frame
    if (!keepInput) for (const a in pressed) pressed[a] = false;
  }

  // ---------- title ----------
  const menuItems = () => save.level > 0 && save.level < LEVELS.length ? ['CONTINUE', 'NEW GAME'] : ['NEW GAME'];
  function stepTitle() {
    if (settingsOpen) return;
    const items = menuItems();
    if (menuSel >= items.length) menuSel = 0;
    if (items.length > 1 && (pressed.jump || pressed.down)) { menuSel = (menuSel + 1) % items.length; sfx('select'); }
    if (pressed.confirm || pressed.throw) {
      sfx('swap');
      if (items[menuSel] === 'NEW GAME') { save = { level: 0, deaths: 0, time: 0 }; persist(); }
      scene = 'play';
      syncScene();
      loadLevel(Math.min(save.level, LEVELS.length - 1), true);
    }
  }
  function syncScene() {
    if (scene === lastScene) return;
    lastScene = scene;
    $('hud').classList.toggle('off', scene !== 'play');
    $('keys').hidden = scene !== 'title';
    $('settings').hidden = scene !== 'title';
    if (scene !== 'title' && settingsOpen) openSettings(false);
  }

  // ---------- baking ----------
  function bakeBackground() {

    for (let i = 0; i < 260; i++) { b.fillStyle = '#151d28'; b.fillRect(Math.floor(hash(i, 3, levelIdx) * W), Math.floor(hash(i, 7, levelIdx) * H), 1, 2 + Math.floor(hash(i, 9) * 4)); }
    // round window onto the night, in the emptiest patch of the level
    let best = [W / 2, 48], bestScore = -1;
    for (let cy = 2; cy <= 7; cy++) for (let cx = 3; cx <= 16; cx++) {
      let s = 0;
      for (let r = cy - 2; r <= cy + 1; r++) for (let c = cx - 2; c <= cx + 1; c++) if (tileAt(c, r) === '.') s++;
      s += cx / 100;

    b.fillStyle = '#cfc9a8'; b.fillRect(wx + 4, wy - 9, 2, 2); b.fillRect(wx + 9, wy - 5, 3, 2);
    b.fillStyle = '#2a3b52'; b.fillRect(wx - wr, wy + 2, wr * 2, 2);
    b.fillStyle = '#0f1828';
    for (let x = wx - wr; x < wx + wr; x++) { const hh = 6 + Math.sin(x * 0.18) * 3 + Math.sin(x * 0.07 + 1) * 4; b.fillRect(x, wy + wr - 10 - hh, 1, hh + 12); }

    b.fillStyle = '#3a2618'; b.fillRect(wx - wr, wy - 1, wr * 2, 1); b.fillRect(wx - 1, wy - wr, 1, wr * 2);
    for (let x = 40; x < W; x += 96) { b.fillStyle = '#1b130d'; b.fillRect(x, 0, 7, H); b.fillStyle = '#2b1e14'; b.fillRect(x + 1, 0, 1, H); b.fillStyle = '#120c08'; b.fillRect(x + 6, 0, 1, H); }
    b.fillStyle = '#1b130d'; b.fillRect(0, 30, W, 5); b.fillStyle = '#2b1e14'; b.fillRect(0, 30, W, 1); b.fillStyle = '#0d0906'; b.fillRect(0, 35, W, 1);

  function placeDecor() {
    lanterns = [];
    const cands = [];
    for (let c = 2; c < COLS - 2; c++) for (let r = 0; r < ROWS - 4; r++) {
      if (isWall(tileAt(c, r)) && tileAt(c, r + 1) === '.' && tileAt(c, r + 2) === '.' && tileAt(c, r + 3) === '.' && tileAt(c - 1, r + 1) === '.' && tileAt(c + 1, r + 1) === '.') cands.push([c, r]);
    }
    cands.sort((a, b) => hash(a[0], a[1], levelIdx) - hash(b[0], b[1], levelIdx));
    for (const [c, r] of cands) {
      if (lanterns.length >= 3) break;
      if (lanterns.some(l => Math.abs(l.c - c) < 5)) continue;
      if (lamps.some(l => Math.abs(l.dx - c * T) < 40)) continue;
      lanterns.push({ c, r, x: c * T + 8, y: (r + 1) * T, len: 6 + Math.floor(hash(c, r) * 8), ph: hash(r, c) * 6 });
    }
    flies = [];
    for (let i = 0; i < 12; i++) flies.push({ x: hash(i, 1, levelIdx) * W, y: 20 + hash(i, 2, levelIdx) * (H - 50), t: hash(i, 3) * 6, s: 0.01 + hash(i, 4) * 0.02, vx: (hash(i, 5) - 0.5) * 0.1 });
  }

  // Darkness with the steady light sources already cut out; one copy per lamp state.
  function bakeDark() {
    for (const [cnv, on] of [[darkOn, true], [darkOff, false]]) {
      const d = cnv.getContext('2d');
      d.globalCompositeOperation = 'source-over';
      d.clearRect(0, 0, W, H);
      d.fillStyle = 'rgba(3,5,12,0.55)'; d.fillRect(0, 0, W, H);
      d.globalCompositeOperation = 'destination-out';
      const hole = (x, y, r, a) => { const g = d.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(0,0,0,' + a + ')'); g.addColorStop(0.5, 'rgba(0,0,0,' + a * 0.6 + ')'); g.addColorStop(1, 'rgba(0,0,0,0)'); d.fillStyle = g; d.fillRect(x - r, y - r, r * 2, r * 2); };

  function bakeTiles() {
    const t = tileLayer.getContext('2d');
    t.clearRect(0, 0, W, H);
    const f = (c, x, y, w, h) => { t.fillStyle = c; t.fillRect(x, y, w, h); };
    const open = (c, r) => !isWall(tileAt(c, r));
    const depth = [];
    for (let r = 0; r < ROWS; r++) { depth.push([]); for (let c = 0; c < COLS; c++) {
      if (!isWall(grid[r][c])) { depth[r].push(0); continue; }

        for (let course = 0; course < 2; course++) {

          for (let bx = -16; bx < 16; bx += 16) {

            if (x2 <= x1) continue;
            const v = hash(Math.floor((x0 + 1000) / 16), r * 2 + course);
            f(v < 0.25 ? pal[2] : pal[0], x1, yy, x2 - x1, 8);
            f(pal[1], x1, yy, x2 - x1, 1);
            f(pal[3], x1, yy + 7, x2 - x1, 1);
            if (x0 >= x && x0 < x + 16) f(pal[3], x0, yy, 1, 8);
            if (v > 0.8) { f(pal[3], x1 + 3, yy + 3, 3, 1); f(pal[3], x1 + 5, yy + 4, 2, 1); }

        if (open(c - 1, r)) { f('#0a0d11', x, y, 1, T); f('#6b7e8e', x + 1, y + 1, 1, T - 2); }
        if (open(c + 1, r)) { f('#0a0d11', x + T - 1, y, 1, T); f('#2a333d', x + T - 2, y + 1, 1, T - 2); }

          f(rot ? '#85765a' : '#9a6136', px0, y, 1, T);
          for (let g2 = 0; g2 < 3; g2++) { const gy = y + Math.floor(hash(c * 3 + i, r, g2) * 14); f(rot ? '#54493a' : '#5c351c', px0 + 2, gy, 1, 3); }
        }
        f(rot ? '#2d261b' : '#2a170c', x + 5, y, 1, T); f(rot ? '#2d261b' : '#2a170c', x + 10, y, 1, T);
        if (r % 2 === 0) { f('#2b2f36', x, y + 6, T, 3); f('#4c535c', x, y + 6, T, 1); f('#9aa4ad', x + 2, y + 7, 1, 1); f('#9aa4ad', x + 13, y + 7, 1, 1); }
        if (rot) {

        if (open(c + 1, r)) { f('#120a05', x + T - 1, y, 1, T); f(rot ? '#a8987a' : '#c3854a', x + T - 2, y, 1, T); }
        if (open(c, r - 1)) { f('#120a05', x, y, T, 1); f(rot ? '#b8a888' : '#e6ad6c', x, y + 1, T, 2); f(rot ? '#85765a' : '#9a6136', x, y + 3, T, 1); }

        f('#5a412b', x + 7, y, 1, T); f('#5a412b', x, y + 7, T, 1);

  // ---------- drawing ----------
  const px = (c, x, y, w, h) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
  function drawPlayer() {
    let leg = 'stand';
    if (!p.ground) leg = p.vy < 0 ? 'jump' : 'fall';
    else if (p.walk) leg = 'run' + (Math.floor(p.walk / 5) % 4);
    const blink = (tick % 170) < 6 ? 1 : 0;
    const thr = p.throwT > 0 ? 1 : 0;
    const spr = PF[leg + blink + thr][p.face > 0 ? 0 : 1];
    const bob = (leg === 'run0' || leg === 'run2') ? -1 : 0;
    const sq = p.squash;
    if (sq) {
      const sx = 1 + sq * 0.05, sy = 1 - sq * 0.05;
      const w = spr.width * sx, h = spr.height * sy;
      ctx.drawImage(spr, Math.round(p.x + 5 - w / 2), Math.round(p.y + 14 - h + 1), Math.round(w), Math.round(h));
    } else ctx.drawImage(spr, Math.round(p.x) - 3, Math.round(p.y) - 3 + bob);
  }
  function drawScarf() {
    const pts = [{ x: p.x + (p.face > 0 ? 1 : 9), y: p.y + 5 }, ...p.scarf];
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      for (let j = 0; j < 3; j++) {
        const xx = Math.round(a.x + (b.x - a.x) * j / 3), yy = Math.round(a.y + (b.y - a.y) * j / 3);
        px(i > 3 ? '#8f2b26' : '#d6463a', xx, yy, 1, i > 4 ? 1 : 2);
      }
    }
  }
  function drawKunai() {
    if (k.state === 'hand') return;
    const [cx, cy] = kCenter();
    const rx = Math.round(cx), ry = Math.round(cy);
    ctx.save();
    ctx.translate(rx, ry);
    if (k.state === 'return') ctx.rotate(Math.PI / 2 * (Math.floor(tick / 2) % 4));
    else {
      if (k.state === 'fly') {
        // a short streak behind it
        ctx.save(); ctx.rotate(Math.atan2(k.dy, k.dx));
        ctx.globalAlpha = 0.35; px('#cfe8ff', -17, 0, 10, 1);
        ctx.globalAlpha = 0.15; px('#cfe8ff', -25, 0, 8, 1);
        ctx.globalAlpha = 1; ctx.restore();
      }
      let jx = 0;
      if (k.state === 'stuck' && k.tile) { const cr = crumble[k.tile[0] + ',' + k.tile[1]] || 0; if (cr > CRUMBLE * 0.6) jx = tick % 4 < 2 ? 1 : -1; }
      ctx.translate(jx, 0);
      ctx.rotate(Math.atan2(k.dy, k.dx));
    }
    ctx.drawImage(KUNAI, -8, -2);
    ctx.restore();
    if (k.state === 'stuck' && !kVert()) {
      const sway = Math.round(Math.sin(tick / 9) * 1.2);
      const tx = k.dx > 0 ? Math.round(k.x) + 1 : Math.round(k.x) + KW - 2, ty = Math.round(k.y);
      px('#d6463a', tx, ty + 3, 1, 2); px('#d6463a', tx + sway, ty + 5, 1, 2); px('#8f2b26', tx + sway, ty + 7, 1, 1);
    }
  }
  function drawWisp(s) {
    if (s.kind === 'B') return drawBoss(s);
    const bob = s.kind === 'O' ? 0 : Math.sin(s.t * 2) * 1.5, cx = s.x + 5, cy = s.y + 5 + bob;
    const tint = s.kind === 'O' ? ['#c9a0ff', '#e6d2ff', '#f7f0ff', '#8a64c8'] : ['#7fd2d8', '#b8eef0', '#effdff', '#5fb7c4'];
    ctx.globalAlpha = 0.25; ctx.fillStyle = tint[3];
    ctx.beginPath(); ctx.arc(cx, cy, 8 + Math.sin(s.t * 5) * 0.8, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    const fl = Math.sin(s.t * 7) * 1.5, lean = s.kind === 'V' ? 0 : -s.dir * 4;
    ctx.fillStyle = tint[0];
    ctx.beginPath(); ctx.moveTo(cx - 5, cy); ctx.quadraticCurveTo(cx - 3 + lean / 2, cy - 10 - fl, cx + lean, cy - 13 - fl); ctx.quadraticCurveTo(cx + 3, cy - 6, cx + 5, cy); ctx.fill();
    ctx.fillStyle = tint[1]; ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = tint[2]; ctx.beginPath(); ctx.arc(cx - 0.5, cy + 0.5, 3, 0, Math.PI * 2); ctx.fill();
    const ex = Math.round(cx) + (s.kind === 'V' ? 0 : s.dir), ey = Math.round(cy);
    px('#16303a', ex - 2, ey - 1, 1, 2); px('#16303a', ex + 1, ey - 1, 1, 2); px('#16303a', ex - 1, ey + 2, 2, 1);
    if (tick % 5 === 0) parts.push({ x: cx + (Math.random() - 0.5) * 6, y: cy - 4, vx: 0, vy: -0.3, life: 0, max: 22, g: 0, c: tint[0], s: 1, drag: 1 });
  }
  // the great spirit: a haunted paper lantern; its eye burns gold when it is about to dive
  function drawBoss(s) {
    const cx = s.x + 11, cy = s.y + 11;
    const angry = s.mode === 'warn' || s.mode === 'dive';
    let set = angry ? BOSS_ANGRY : (tick % 150) < 6 ? BOSS_BLINK : BOSS;
    if (s.inv > 0 && (s.inv >> 2) % 2) set = BOSS_WHITE;
    // the sprite's eye sits left of centre, so it faces left by default
    const img = set[s.dir < 0 ? 0 : 1];
    const jitter = s.mode === 'warn' ? (tick % 4 < 2 ? 1 : -1) : 0;
    const bob = s.mode === 'drift' ? Math.round(Math.sin(s.a * 6) * 1) : 0;
    ctx.drawImage(img, Math.round(cx - img.width / 2) + jitter, Math.round(cy - img.height / 2) + bob);
    for (let i = 0; i < 3; i++) px(i < s.hp ? '#ffd27a' : '#3a1a10', Math.round(cx) - 5 + i * 4, Math.round(cy) - 17, 2, 2);
  }
  function drawCage(cg) {
    const x = cg.x, y = cg.y;
    if (cg.freed) {
      if (cg.hop == null || cg.hop > 60) return;
      const hy = -Math.abs(Math.sin(cg.hop / 8)) * 10 - cg.hop * 0.2;
      ctx.globalAlpha = Math.max(0, 1 - cg.hop / 60);
      ctx.drawImage(KIT, x + 1, Math.round(y + 6 + hy));
      ctx.globalAlpha = 1;
      return;
    }
    const b = Math.floor(tick / 28) % 2;
    px('#5a4630', x + 5, y - 6, 1, 6);
    ctx.drawImage((tick % 140) < 6 ? KIT_BLINK : KIT, x + 1, y + 5 + b);
    px('#2a2010', x - 1, y + 1, 14, 3); px('#e0c46a', x - 1, y + 1, 14, 1); px('#9c8238', x - 1, y + 3, 14, 1);
    px('#2a2010', x - 1, y + 13, 14, 3); px('#e0c46a', x - 1, y + 13, 14, 1); px('#9c8238', x - 1, y + 15, 14, 1);
    for (let i = 0; i < 5; i++) { const bx = x + i * 3 - (i === 4 ? 1 : 0); px('#1a1408', bx - 1, y + 4, 1, 9); px('#e0c46a', bx, y + 4, 1, 9); px('#f5e6a8', bx, y + 6, 1, 1); px('#9c8238', bx, y + 9, 1, 1); }
    px('#d6463a', x + 4, y - 1, 4, 3); px('#8f2b26', x + 4, y + 1, 4, 1);
  }
  function drawLantern(l) {
    const sway = Math.sin(tick / 40 + l.ph) * 1.2;
    const bx = Math.round(l.x + sway), by = l.y + l.len;
    ctx.strokeStyle = '#2a1d12'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(l.x + 0.5, l.y); ctx.lineTo(bx + 0.5, by); ctx.stroke();
    px('#1a120c', bx - 3, by, 7, 2);
    px('#a3302a', bx - 4, by + 2, 9, 9); px('#c8423a', bx - 5, by + 4, 11, 5); px('#e8604a', bx - 2, by + 3, 3, 7);
    px('#f2a35a', bx - 1, by + 5, 1, 3);
    px('#6e1f1b', bx - 5, by + 5, 11, 1); px('#6e1f1b', bx - 5, by + 7, 11, 1);
    px('#1a120c', bx - 3, by + 11, 7, 2);
    px('#d6463a', bx, by + 13, 1, 3 + (tick % 60 < 30 ? 0 : 1));
  }
  // spirit lamp: a floating paper lamp holding a blue fox-fire, or dark with a dying ember
  function drawLamp(l) {
    const bob = Math.round(Math.sin(tick / 22 + l.ph) * 1.2);
    const x = l.dx, y = l.dy + bob;
    px('#0b0e12', x + 2, y - 1, 6, 3); px('#3a4250', x + 3, y - 1, 4, 1);
    if (lampOn) {
      px('#0b0e12', x - 1, y + 2, 12, 9); px('#cfeff0', x, y + 2, 10, 9); px('#f4ffff', x + 2, y + 3, 6, 7);
      px('#7fbfc0', x, y + 4, 10, 1); px('#7fbfc0', x, y + 8, 10, 1);
      const fl = (tick >> 2) % 3;
      px('#9fe3e6', x + 4, y + 4 - (fl === 1 ? 1 : 0), 2, 4); px('#ffffff', x + 4, y + 6, 2, 2);
    } else {
      px('#0b0e12', x - 1, y + 2, 12, 9); px('#3a4048', x, y + 2, 10, 9); px('#4a515a', x + 2, y + 3, 6, 7);
      px('#262b31', x, y + 4, 10, 1); px('#262b31', x, y + 8, 10, 1);
      if ((tick >> 4) % 2) px('#e8a050', x + 4, y + 7, 2, 1); else px('#9a5a30', x + 4, y + 7, 2, 1);
      if (tick % 18 === 0) parts.push({ x: x + 5, y: y, vx: (Math.random() - 0.5) * 0.2, vy: -0.25, life: 0, max: 30, g: 0, c: '#4a515a', s: 1, drag: 1 });
    }
    px('#0b0e12', x + 2, y + 11, 6, 2); px('#3a4250', x + 3, y + 11, 4, 1);
    px(lampOn ? '#5fb7c4' : '#7a5030', x + 4, y + 13, 2, 2 + ((tick >> 4) % 2));
  }
  // A glint runs along each row of spikes now and then so they read as sharp, and light catches the mirrors.
  function drawShine() {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const ch = grid[r][c], x = c * T, y = r * T;
      if (ch === '^' || ch === 'v') {
        const ph = (tick + c * 6 + r * 11) % 150;
        if (ph < 16) {
          const i = Math.floor(ph / 4), sx = x + i * 4 + 2, ty = ch === '^' ? y + 8 : y + 9;
          ctx.globalAlpha = 1 - (ph % 4) / 5;
          px('#ffffff', sx, ty, 1, 2); px('#ffd0c8', sx - 1, ty + (ch === '^' ? 2 : -1), 3, 1);
          ctx.globalAlpha = 1;
        }
        if ((tick + c * 17) % 240 < 2) px('#ff6a55', x + 2 + ((c * 5) % 12), ch === '^' ? y + 9 : y + 6, 1, 1);
      } else if (isMirror(ch)) {
        const ph = (tick + c * 23 + r * 7) % 180;
        if (ph < 12) {
          const u = -5 + ph, gx = ch === '/' ? x + 8 + u * 0.7 : x + 8 + u * 0.7, gy = ch === '/' ? y + 7 - u * 0.7 : y + 7 + u * 0.7;
          ctx.globalAlpha = 0.9; px('#ffffff', Math.round(gx), Math.round(gy), 1, 1); ctx.globalAlpha = 1;
        }
      }
    }
  }
  function drawGates() {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const ch = grid[r][c];
      const x = c * T, y = r * T;
      if (ch === 'b') {
        // the seal: a barred shrine door with a paper charm, glowing with the lantern's fire
        ctx.globalAlpha = 0.22 + 0.06 * Math.sin(tick / 8 + r);
        px('#ff7a3a', x + 1, y, 14, T);
        ctx.globalAlpha = 1;
        px('#2a1a10', x + 2, y, 2, T); px('#2a1a10', x + 12, y, 2, T); px('#6a4428', x + 2, y, 1, T); px('#6a4428', x + 12, y, 1, T);
        px('#1a1410', x + 5, y + 2, 6, 12); px('#f1e6c8', x + 6, y + 3, 4, 10); px('#c03030', x + 7, y + 5, 2, 1); px('#c03030', x + 7, y + 8, 2, 3);
        continue;
      }
      if (!isGate(ch)) continue;
      const blue = ch === 'g';
      const on = gateUp(ch, lampOn), held = false;
      const core = blue ? '#9fe3e6' : '#f0a860', bright = blue ? '#e9fbff' : '#ffe2b8', deep = blue ? '#2c6a74' : '#7a4420';
      if (on || held) {
        ctx.globalAlpha = held ? 0.12 + 0.1 * Math.sin(tick / 3) : 0.32 + 0.05 * Math.sin(tick / 9 + r);
        px(core, x + 1, y, 14, T);
        ctx.globalAlpha = 1;
        for (const i of [2, 5, 8, 10, 13]) {
          ctx.globalAlpha = Math.min(1, (held ? 0.3 : 0.65) + 0.3 * Math.sin(tick / 7 + i + r * 1.3));
          px(i === 8 ? bright : core, x + i, y, 1, T);
        }
        ctx.globalAlpha = held ? 0.4 : 0.9;
        for (let j = 0; j < 2; j++) { const ry = y + ((tick * 0.4 + j * 8 + c * 5 + r * 3) % 16); px(bright, x + 5 + j * 4, Math.floor(ry), 2, 1); }
        ctx.globalAlpha = 1;
      } else {
        ctx.globalAlpha = 0.35;
        for (let yy = y + 1; yy < y + T; yy += 4) { px(deep, x + 3, yy, 1, 1); px(deep, x + 11, yy, 1, 1); }
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawLighting() {
    lctx.globalCompositeOperation = 'source-over';
    lctx.clearRect(0, 0, W, H);
    lctx.drawImage(lampOn ? darkOn : darkOff, 0, 0);
    lctx.globalCompositeOperation = 'destination-out';
    const hole = (x, y, r, a) => {
      const g = lctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(0,0,0,' + a + ')'); g.addColorStop(0.5, 'rgba(0,0,0,' + a * 0.6 + ')'); g.addColorStop(1, 'rgba(0,0,0,0)');
      lctx.fillStyle = g; lctx.fillRect(x - r, y - r, r * 2, r * 2);
    };
    hole(p.x + 5, p.y + 7, 52, 0.85);
    for (const s of wisps) if (s.alive) hole(s.x + s.w / 2, s.y + s.h / 2, s.kind === 'B' ? 70 : 40, 0.9);
    for (const cg of cages) if (!cg.freed) hole(cg.x + 6, cg.y + 8, 26, 0.6);
    if (k.state !== 'hand') { const [cx, cy] = kCenter(); hole(cx, cy, 18, 0.7); }
    ctx.drawImage(lightLayer, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    const glow = (x, y, r, col) => { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); };
    for (const l of lanterns) glow(l.x, l.y + l.len + 7, 30, 'rgba(255,120,60,0.16)');
    for (const s of wisps) if (s.alive) glow(s.x + s.w / 2, s.y + s.h / 2, s.kind === 'B' ? 44 : 22, s.kind === 'B' ? 'rgba(255,140,60,0.24)' : s.kind === 'O' ? 'rgba(190,140,255,0.2)' : 'rgba(120,230,240,0.18)');
    for (const l of lamps) glow(l.dx + 5, l.dy + 7, lampOn ? 26 : 12, lampOn ? 'rgba(130,230,240,0.24)' : 'rgba(232,160,80,0.12)');
    for (const f of flies) glow(f.x, f.y, 4, 'rgba(220,240,140,0.25)');
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawIris() {
    if (iris >= 1) return;
    const cx = p ? p.x + 5 : W / 2, cy = p ? p.y + 7 : H / 2;
    const r = Math.pow(iris, 1.6) * 360;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.rect(-10, -10, W + 20, H + 20); ctx.arc(cx, cy, Math.max(0.1, r), 0, Math.PI * 2, true); ctx.fill('evenodd');
  }

  function drawWorld() {
    ctx.drawImage(bgLayer, 0, 0);
    const sx = shake > 0 ? Math.round((Math.random() - 0.5) * shake) : 0;
    const sy = shake > 0 ? Math.round((Math.random() - 0.5) * shake) : 0;
    ctx.save(); ctx.translate(sx, sy);
    for (const l of lanterns) drawLantern(l);
    ctx.drawImage(tileLayer, 0, 0);
    drawShine();
    drawGates();
    for (const h of holes) { px('#2a1d12', h.x - 1, h.y - 1, 3, 3); px('#140d08', h.x, h.y, 1, 1); px('#c4b392', h.x - 2, h.y, 1, 1); px('#c4b392', h.x + 2, h.y - 1, 1, 1); }
    for (const key in crumble) {
      const [c, r] = key.split(',').map(Number);
      if (grid[r][c] !== 'w') continue;
      const n = Math.floor(crumble[key] / 8);
      for (let i = 0; i < n; i++) px('#1a140c', c * T + 2 + Math.floor(hash(c, r, i) * 12), r * T + Math.floor(hash(r, c, i) * 14), 1, 3);
    }
    for (const l of lamps) drawLamp(l);
    for (const cg of cages) drawCage(cg);
    for (const s of wisps) if (s.alive) drawWisp(s);
    for (const gh of ghosts) {
      ctx.globalAlpha = 0.5 * (1 - gh.life / 18);
      ctx.drawImage(PF['stand00'][gh.face > 0 ? 0 : 1], Math.round(gh.x) - 3, Math.round(gh.y) - 3);
      ctx.globalAlpha = 1;
    }
    if (mode !== 'dead') {
      drawScarf();
      drawPlayer();
      if (p.airJump && tick % 6 < 4) px('#b5e38a', Math.round(p.x) + 4, Math.round(p.y) - 6, 2, 1);
    }
    drawKunai();
    for (const q of parts) {
      ctx.globalAlpha = Math.max(0, 1 - q.life / q.max);
      if (q.leaf) { px(q.c, Math.round(q.x), Math.round(q.y), 2, 1); px(q.c, Math.round(q.x) + 1, Math.round(q.y) - 1, 1, 1); }
      else px(q.c, Math.round(q.x), Math.round(q.y), q.s, q.s);
    }
    ctx.globalAlpha = 1;
    for (const f of flies) { ctx.globalAlpha = 0.5 + Math.sin(f.t * 4) * 0.5; px('#e8f59a', Math.round(f.x), Math.round(f.y), 1, 1); }
    ctx.globalAlpha = 1;
    ctx.restore();
    drawLighting();
    if (mode === 'play' && swapsLeft > 0 && k.state !== 'hand') {
      const [kcx, kcy] = kCenter();
      ctx.globalAlpha = 0.22; ctx.strokeStyle = '#9fe3e6'; ctx.setLineDash([2, 3]);
      ctx.beginPath(); ctx.moveTo(p.x + 5, p.y + 7); ctx.lineTo(kcx, kcy); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    ctx.drawImage(vignette, 0, 0);
    if (flashT > 0) { ctx.globalAlpha = flashT / 10; px(mode === 'dead' ? '#ffd0c0' : '#e9fbff', 0, 0, W, H); ctx.globalAlpha = 1; }
    drawIris();
  }

  function text(str, x, y, size, color) {
    ctx.font = size + 'px "DotGothic16", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#000'; ctx.fillText(str, x, y + Math.max(1, size / 12));
    ctx.fillStyle = color; ctx.fillText(str, x, y);
  }
  function drawTitle() {
    ctx.drawImage(bgLayer, 0, 0);
    for (const l of lanterns) drawLantern(l);
    ctx.drawImage(tileLayer, 0, 0);
    ctx.fillStyle = 'rgba(4,6,12,0.6)'; ctx.fillRect(0, 0, W, H);
    for (const f of flies) { ctx.globalAlpha = 0.5 + Math.sin(f.t * 4) * 0.5; px('#e8f59a', Math.round(f.x), Math.round(f.y), 1, 1); }
    ctx.globalAlpha = 1;
    ctx.drawImage(vignette, 0, 0);
    if (settingsOpen) ctx.globalAlpha = 0.35;
    text(GAME_TITLE, W / 2, 60, 32, '#efe5cf');
    text(GAME_SUB, W / 2, 86, 12, '#d6463a');
    ctx.drawImage(KUNAI, W / 2 + 60, 48);
    menuItems().forEach((it, i) => {
      const sel = i === menuSel;
      text((sel ? '›  ' : '') + it + (it === 'CONTINUE' ? '  ·  LEVEL ' + (save.level + 1) : '') + (sel ? '  ‹' : ''), W / 2, 120 + i * 16, 12, sel ? '#e8a050' : '#7d8a94');
    });
    ctx.globalAlpha = 1;
  }
  function drawEnd() {
    ctx.drawImage(bgLayer, 0, 0);
    ctx.fillStyle = 'rgba(4,6,12,0.6)'; ctx.fillRect(0, 0, W, H);
    ctx.drawImage(vignette, 0, 0);
    text('THE SHRINE SLEEPS', W / 2, 64, 20, '#efe5cf');
    text('every kit is home', W / 2, 88, 12, '#9fe3e6');
    const t = save.time, m = Math.floor(t / 60), s = (t % 60).toFixed(1).padStart(4, '0');
    text('DEATHS  ' + save.deaths + '      TIME  ' + m + ':' + s, W / 2, 118, 12, '#e8a050');
    for (let i = 0; i < 5; i++) ctx.drawImage(KIT, W / 2 - 40 + i * 18, 150 + ((Math.floor(tick / 10) + i) % 2));
  }
  function draw() {
    syncScene();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = false;
    if (scene === 'title') drawTitle();
    else if (scene === 'end') drawEnd();
    else drawWorld();
  }

  // ---------- HUD ----------
  function updateHud() {
    $('lvl').textContent = 'LEVEL ' + (levelIdx + 1);
    $('deaths').textContent = 'DEATHS ' + save.deaths;
    const el = $('swaps');
    el.textContent = 'SWAPS: ' + swapsLeft;
    el.classList.toggle('zero', swapsLeft === 0);
  }
  let introTimer = 0;
  function introSwaps() {
    const el = $('swaps'), st = $('stage'), veil = $('veil');
    clearTimeout(introTimer);
    el.style.transition = 'none'; el.style.transform = '';
    const r = el.getBoundingClientRect(), s = st.getBoundingClientRect();
    const dx = (s.left + s.width / 2) - (r.left + r.width / 2), dy = (s.top + s.height / 2) - (r.top + r.height / 2);
    el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(2.4)';
    veil.classList.add('on');
    void el.offsetWidth;
    introTimer = setTimeout(() => {
      el.style.transition = 'transform .75s cubic-bezier(.7,0,.25,1)';
      el.style.transform = '';
      veil.classList.remove('on');
    }, 850);
  }

  function fit() {
    const avail = $('stage').parentElement.clientWidth;
    const touch = matchMedia('(pointer: coarse)').matches;
    const maxH = Math.max(200, innerHeight - (touch ? 160 : 90));
    let s = Math.min(avail / W, maxH / H);
    if (s >= 2) s = Math.floor(s * 2) / 2;
    cv.style.width = Math.floor(W * s) + 'px';
    cv.style.height = Math.floor(H * s) + 'px';
    $('stage').style.setProperty('--u', s + 'px');
  }
  addEventListener('resize', fit);

  // ---------- boot ----------
  const STEP_MS = 1000 / 60;
  let acc = 0, last = performance.now();
  const api = { manual: false };
  function frame(now) {
    acc += Math.min(100, now - last); last = now;
    if (!api.manual) while (acc >= STEP_MS) { step(); acc -= STEP_MS; }
    else acc = 0;
    draw();
    requestAnimationFrame(frame);
  }
  // test hook: drive the game one frame at a time
  Object.assign(api, { load: i => { scene = 'play'; syncScene(); loadLevel(i, false); }, step, press, release });
  Object.defineProperty(api, 'state', { get: () => ({ p, k, mode, levelIdx, swapsLeft, cages, wisps, lamps, lampOn, scene, grid }) });
  window.__game = api;

  function start(data) {
    buildPlayerFrames();
    levelIdx = Math.min(save.level, LEVELS.length - 1);
    grid = LEVELS[levelIdx].map.map(r => r.split('').map(ch => 'PCEVOLB'.includes(ch) ? '.' : ch));
    bakeTiles(); bakeBackground(); placeDecor();
    renderBinds();
    fit(); soundLabel(); syncScene();
    if (data && typeof data.level === 'number' && data.scene === 'play') { scene = 'play'; syncScene(); loadLevel(data.level, false); }
    requestAnimationFrame(frame);
  }
  window.claude?.hot?.snapshot?.(() => ({ level: levelIdx, scene }));
  const boot = d => (document.fonts && document.fonts.load ? document.fonts.load('16px "DotGothic16"').catch(() => {}) : Promise.resolve()).then(() => start(d));
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>

</body>
